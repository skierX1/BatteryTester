<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>RC battery tester</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* --- your original CSS untouched --- */
    :root {
      --bg-color: #e8f4ff;
      --text-color: #111;
      --card-bg: rgba(255,255,255,0.9);
      --border-color: #ccc;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: var(--bg-color) url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: var(--text-color);
      transition: background-color 0.4s, color 0.4s;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f1f1f1;
      --card-bg: #1e1e1e;
      --border-color: #444;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      z-index: -1;
      transition: filter 0.4s;
    }

    body.dark-mode::before {
      filter: invert(1) hue-rotate(180deg);
    }

    h1 {
      margin-bottom: 10px;
      background: var(--card-bg);
      display: inline-block;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .dark-mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #222;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }

    .dark-mode-toggle:hover { background: #444; }

    .control-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid var(--border-color);
      width: fit-content;
      margin-bottom: 25px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .testname {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .testname label {
      font-weight: bold;
      margin-right: 10px;
    }

    .testname input {
      width: 250px;
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      color: #000;
    }

    body.dark-mode .testname input {
      background: #333;
      color: #f1f1f1;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

	.countdown-frame {
	  display: inline-flex;
	  align-items: center;
	  gap: 8px;
	  padding: 8px 12px;
	  border: 2px solid var(--border-color);
	  border-radius: 10px;
	  background: var(--card-bg);
	  transition: border-color 0.3s, background-color 0.3s;
	}
	
	/* Optional: green variant */
	.countdown-frame.green {
	  border-color: #4caf50;
	  background: rgba(76, 175, 80, 0.1);
	}

    .circle-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.15s ease, background 0.3s;
    }

    .circle-btn:active { transform: scale(0.9); }

    #startBtn { background: #4caf50; }
    #stopBtn { background: #f44336; }

    body.dark-mode #startBtn { background: #2e7d32; }
    body.dark-mode #stopBtn { background: #c62828; }

    #seconds {
      width: 80px;
      text-align: center;
      padding: 8px;
      font-weight: bold;
      font-size: 18px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #000;
    }

    body.dark-mode #seconds {
      background: #333;
      color: #f1f1f1;
    }

	#countdown {
	  width: 100px;
	  text-align: center;
	  padding: 8px;
	  font-weight: bold;
	  font-size: 27px; /* 1.5× bigger than 18px base size */
	  background: #fff;
	  border: 1px solid var(--border-color);
	  border-radius: 8px;
	  color: #000;
	}

	/* Dark mode for countdown field */
	body.dark-mode #countdown {
	  background: #333;
	  color: #f1f1f1;
}

    .status-box {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 10px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .status-column {
      display: flex;
      flex-direction: column;
    }

    .status-item label {
      font-weight: bold;
      min-width: 70px;
    }

    .status-item input {
      width: 100px;
      text-align: center;
      padding: 6px;
      font-weight: bold;
      font-size: 18px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
      color: #000;
    }

    body.dark-mode .status-item input {
      background: #333;
      color: #f1f1f1;
    }

    ul {
      list-style: none;
      padding-left: 0;
      background: var(--card-bg);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
    }

    li {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
      font-size: 16px;
      flex-grow: 1;
    }

    a:hover { text-decoration: underline; }

    body.dark-mode a { color: #90caf9; }
  </style>
</head>
<body>
  <button class="dark-mode-toggle" id="darkModeBtn">🌙 Dark Mode</button>

  <h1>RC Battery Tester</h1>

  <div class="control-box">
    <div class="testname">
      <label for="testName">Test name:</label>
      <input type="text" id="testName" placeholder="test name e.g. 20251103_LRP_green">
    </div>

    <div class="toolbar">
      <button id="startBtn" class="circle-btn">▶</button>
      <button id="stopBtn" class="circle-btn">⏹</button>
	  <div class="countdown-frame">
		  <label for="countdown" style="font-weight:bold;">Countdown:</label>
		  <input type="text" id="countdown" value="0" readonly>
	  </div>
    </div>


    <div class="status-box">
      <!-- Voltage + Cells stacked vertically -->
      <div class="status-column">
        <div class="status-item">
          <label for="voltage">Voltage:</label>
          <input type="text" id="voltage" value="-- V" readonly>
        </div>
        <div class="status-item">
          <label for="cell1">Cell1:</label>
          <input type="text" id="cell1" value="-- V" readonly>
        </div>
        <div class="status-item">
          <label for="cell2">Cell2:</label>
          <input type="text" id="cell2" value="-- V" readonly>
        </div>
      </div>

      <!-- Other fields stay side-by-side -->
      <div class="status-item">
        <label for="current">Current:</label>
        <input type="text" id="current" value="-- A" readonly>
      </div>
    </div>
  </div>

  <ul id="fileList">
    <li><a href="file:///C:/work/dokument.pdf">dokument.pdf</a></li>
    <li><a href="file:///C:/work/obrazok.png">obrazok.png</a></li>
    <li><a href="file:///C:/work/log1.txt">log1.txt</a></li>
    <li><a href="file:///C:/work/log2.txt">log2.txt</a></li>
    <li><a href="file:///C:/work/log3.txt">log3.txt</a></li>
    <li><a href="file:///C:/work/setup.ini">setup.ini</a></li>
    <li><a href="file:///C:/work/data.csv">data.csv</a></li>
    <li><a href="file:///C:/work/script.py">script.py</a></li>
    <li><a href="file:///C:/work/report.docx">report.docx</a></li>
    <li><a href="file:///C:/work/archive.zip">archive.zip</a></li>
  </ul>

  <script>
    // --- dark mode toggle ---
    document.getElementById("darkModeBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    // --- ESP32-style data fetching ---
    let autoRefreshInterval = null;

    function refreshData() {
      fetch('/data')
        .then(response => response.json())
        .then(data => {
          // update dynamic fields from ESP32 JSON
          document.getElementById("voltage").value = data.voltage + " V";
          document.getElementById("cell1").value = data.cell1 + " V";
          document.getElementById("cell2").value = data.cell2 + " V";
          document.getElementById("current").value = data.current + " A";
          document.getElementById("countdown").value = data.countdown + " sec";

		  if (data.test_running == 1) {
			document.querySelector('.countdown-frame').classList.add('green');  // turn green	
		  }
		  else {	
			document.querySelector('.countdown-frame').classList.remove('green');  // revert
		  }

        })
        .catch(err => console.error('Error fetching data:', err));
    }

    function startTest() { 
	  const inputField = document.getElementById("testName");
	  let rawValue = inputField.value;
	  let cleanedValue = rawValue.replace(/[^a-zA-Z0-9]/g, '');
	  inputField.value = cleanedValue;
	  fetch('/startbtn?name=' + cleanedValue)
		.then(response => response.json())
		.then(data => {
		  // update dynamic fields from ESP32 JSON
		  const btnstart = document.getElementById("startBtn");
		  const btnstop = document.getElementById("stopBtn");
		  if (data.status === "ok") {
			btnstart.disabled = true;   // disable the button
			btnstop.disabled  = false;    // disable the button
		  } else {
			btnstart.disabled = false;   
			btnstop.disabled  = false;  
		  }
		  btnstart.disabled = false;   
		  btnstop.disabled  = false;
		})
		.catch(err => console.error('Error fetching data:', err));
	}
	
	function stopTest() {
	  fetch('/stopbtn')
		.then(response => response.json())
		.then(data => {
		  // update dynamic fields from ESP32 JSON
		  const btnstart = document.getElementById("startBtn");
		  const btnstop = document.getElementById("stopBtn");
		  
		  if (data.status === "ok") {
			btnstart.disabled = false;   // disable the button
			btnstop.disabled  = true;    // disable the button
		  } else {
			btnstart.disabled = false;   
			btnstop.disabled  = false;  
		  }
		  btnstart.disabled = false;   
		  btnstop.disabled  = false;
		})
		.catch(err => console.error('Error fetching data:', err));
	}

    document.getElementById("startBtn").addEventListener("click", () => {startTest()});
	document.getElementById("startBtn").addEventListener("click", (e) => e.currentTarget.setAttribute('disabled', true));
	

    document.getElementById("stopBtn").addEventListener("click", () => {stopTest(); });
	document.getElementById("stopBtn").addEventListener("click", (e) => e.currentTarget.setAttribute('disabled', true));

    // initial fetch + periodic update
    refreshData();
    setInterval(refreshData, 2000);
  </script>
</body>
</html>
